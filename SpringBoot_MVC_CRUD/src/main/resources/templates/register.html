<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{baseui::mybaseLayout(~{::section})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> </title>

    
</head>

<body>

<section>
	
		<div class="container mt-4">
			<div class="row">
				<div class="col-md-6 offset-md-3">
					
					<form th:action="@{/save}" method="post" th:object="${user}" >
						
						<div class="form-group">
						  <label>Name</label>
						  <input type="text" th:field="*{name}" class="form-control" >
						</div>
					  <div class="form-group">
					    <label >Email address</label>
					    <input type="email" th:field="*{email}" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
					    <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
					  </div>
					  <div class="form-group">
					    <label for="exampleInputPassword1">Password</label>
					    <input type="password" th:field="*{password}" class="form-control" id="exampleInputPassword1">
					  </div>
					  
					  <div class="form-group">
					    <label >Mobile No.</label>
					    <input type="text" th:field="*{mob}" class="form-control">
					  </div>
					  <div class="form-group">
					    <label >Aadhar</label>
					    <input type="text" th:field="*{aadhar}" class="form-control">
					  </div>
					  <div class="form-group">
					    <label >Pan</label>
					    <input type="text" th:field="*{pan}" class="form-control">
					  </div>
					  <input type="submit" class="btn btn-primary" value="register"  />
					</form>
					
					
										
				</div>
				
			</div>		
			
		</div>
	
	
</section>
	
	
	
	
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{baseui::mybaseLayout(~{::section})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> </title>

    
</head>

<body>

<section>

	<div class="container mt-4 ">
		<div class="row">
			<div class="col-md-12 offset-md-1   border">
				
				<table class="table">
				  <thead>
				    <tr>
				      <th scope="col">Id</th>
				      <th scope="col">Name</th>
				      <th scope="col">Email</th>
				      <th scope="col">Mobile No.</th>
					<th scope="col">Address</th>
					<th scope="col">Aadhar</th>
					<th scope="col">Pan</th>
					<th scope="col">Action</th>				  					  			  
				    </tr>
				  </thead>
				  
				  <tbody>
				    <tr th:each="u:${userDtoList}">
				      <th scope="row" th:text="${u.id}"></th>
				      <td th:text="${u.name}"></td>
				      <td th:text="${u.email}"></td>
				      <td th:text="${u.mob}"></td>
					  <td th:text="${u.address}"></td>
						<td th:text="${u.aadhar}"></td>
					  <td th:text="${u.pan}"></td>
					  <td>
						<a class="btn btn-warning" th:href="@{/edit/{id}(id=${u.id})}">Edit</a>
						<a class="btn btn-danger" th:href="@{/delete/{id}(id=${u.id})}">Delete</a>
					  </td>
				    </tr>
				    
				  </tbody>
				</table>
				
			</div>
		</div>
		
	</div>
		
</section>
	
	
	
	
</body>
</html>

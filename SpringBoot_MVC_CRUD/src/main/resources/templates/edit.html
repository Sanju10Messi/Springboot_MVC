<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{baseui::mybaseLayout(~{::section})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> </title>

    
</head>

<body>

<section>
	
	<div class="container mt-4">
		<div class="row">
			<div class="col-md-6 offset-md-3">
				
				<form th:action="@{/update}" method="post" th:object="${userEdit}">
					  
					  <input type="hidden" th:field="*{id}" class="form-control" >
					
					
					<div class="form-group">
					  <label>Name</label>
					  <input type="text" th:field="*{name}" class="form-control" >
					</div>
				  <div class="form-group">
				    <label for="exampleInputEmail1">Email address</label>
				    <input type="text" th:field="*{email}" class="form-control">
				  </div>
				  
				  
				  <div class="form-group">
				  <label>Mobile No.</label>
				  <input type="text" th:field="*{mob}"class="form-control" >
				  
				  <div class="form-group">
				  <label>Address</label>
				  <input type="text" th:field="*{address}" class="form-control">
				  
				  <div class="form-group">
				  <label>Aadhar</label>
				  <input type="text" class="form-control" th:field="*{aadhar}" >
				  
				  <div class="form-group">
				  <label>Pan</label>
				  <input type="text" class="form-control" th:field="*{pan}">
				  </div>
				  
				  <input type="submit" class="btn btn-primary" />
				  
				</form>
				
			</div>
		</div>
	</div>

	
</section>
	
	
	
	
</body>
</html>
